[package]
name = "emuland"
version = "0.1.0"
edition = "2024"
description = "Desktop front end for the emuland Game Boy / Game Boy Color emulator"
license = "MIT"
readme = "../README.md"
publish = false

[dependencies]
cpal = "0.18.2"
eframe = "0.37.0"
gb-core = { version = "0.1.0", path = "../gb-core" }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
